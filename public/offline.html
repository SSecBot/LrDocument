<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <title>Bağlantı yok · LrDocument</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0e0f11; color: #f1f3f4; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      .card { max-width: 380px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #9aa3aa; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      a { display: inline-block; background: #c2560c; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 12px 20px; border-radius: 10px; }
      a:hover { background: #d2620f; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="/icons/icon-192.png" alt="" />
        <h1>İnternet bağlantısı yok</h1>
        <p>LrDocument’e ulaşılamıyor. Bağlantınız geri geldiğinde kaldığınız yerden devam edebilirsiniz; kaydedilmiş verileriniz sunucuda güvende.</p>
        <a href="/dashboard">Tekrar dene</a>
      </div>
    </main>
  </body>
</html>
